<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gothic Match R</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<main id="main">
  <div class="top">
    <span class="hpme"><b id="meHp"></b> <span class="ward" id="wardTag" hidden>Ward</span> <span class="ward pierce" id="ammoTag" hidden>Pierce ×1</span> <span class="pips" id="pips"><span></span><span></span><span></span></span></span>
    <span class="score"><span class="coin">Gold <b id="money">0</b></span></span>
    <span class="hpfoe"><b id="foeHp"></b></span>
  </div>
  <section class="stage" id="stage">
    <canvas id="bg" aria-hidden="true"></canvas><div id="rageGlow" aria-hidden="true"></div>
    <button class="mus" id="musicBtn" type="button" aria-label="Sound settings" aria-expanded="false" aria-controls="volPanel">♪</button>
    <div class="volpanel" id="volPanel" role="dialog" aria-label="Sound" hidden>
      <div class="vhead">Sound<button type="button" class="vclose" id="volClose" aria-label="Close">✕</button></div>
      <label class="vrow"><span>Music</span><input type="range" id="volBgm" min="0" max="100" step="1"><b>80</b></label>
      <label class="vrow"><span>Effects</span><input type="range" id="volSfx" min="0" max="100" step="1"><b>80</b></label>
    </div>
    <div class="foehead"><h2 id="foeName"></h2><div class="turns" id="turns"></div></div>
    <div class="pw"><img id="pwIcon" alt=""><span id="pwLabel">Power</span><div class="bar"><i id="pwBar"></i></div></div>
    <div class="armrow"><span>Armour</span><div class="segs" id="segs"></div><span class="chips" id="chips"></span></div>
    <div id="foe"></div>
    <div id="lackey" aria-label="Andressa the archer"></div>
    <div class="speech lspeech" id="lspeech" role="status"><div class="paper"></div></div>
    <div class="speech" id="speech" role="status"><div class="paper"></div></div>
    <div class="feed fl" id="feed-me"></div><div class="feed fr" id="feed-foe"></div>
  </section>
  <div class="arena">
    <div class="vbar me" id="vbMe" aria-label="Your HP"><i class="ghost" id="meGhost"></i><i id="meBar"></i></div>
    <div class="box">
      <canvas id="c"></canvas><div class="mult" id="mult" aria-hidden="true"></div><div class="choose" id="choose" role="status">Choose a gem</div>
      <div class="over" id="over"></div>
      
    </div>
    <div class="vbar foe" id="vbFoe" aria-label="Enemy HP"><i class="ghost" id="foeGhost"></i><i id="foeBar"></i></div>
  </div>
  <div class="gauges" id="gauges"></div>
  <div class="satchel" id="satchel" aria-label="Satchel"></div>
  <div class="toast" id="toast"></div>
</main>
<canvas id="fx" aria-hidden="true"></canvas><div id="hurtflash" aria-hidden="true"></div>
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/enemies.js"></script>
<script src="js/art.js"></script>
<script src="js/pose.js"></script>
<script src="js/scars.js"></script>
<script src="js/game.js"></script>
</body>
</html>
